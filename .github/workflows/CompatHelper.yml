name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs=["", "test", "docs", "examples", "benchmark", "benchmark/compare/gpu"])'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With a deploy key, the pull requests that CompatHelper opens start CI.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
